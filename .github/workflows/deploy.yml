name: Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
          set -e
          
          DEPLOY_DIR="/home/lawrence/nvrcms"
          GO_PATH="/usr/local/go/bin"
          
          echo "🔄 Starting deployment..."
          
          # Stop service
          sudo systemctl stop nvrcms-api || true
          
          # Clean deploy directory
          echo "🧹 Cleaning old deployment..."
          if [ -d "$DEPLOY_DIR" ]; then
            rm -rf "$DEPLOY_DIR"
          fi
          
          # Install Go if not present
          if [ ! -d "/usr/local/go" ]; then
            echo "📦 Installing Go 1.25..."
            cd /tmp
            wget -q https://go.dev/dl/go1.25.0.linux-amd64.tar.gz
            sudo tar -C /usr/local -xzf go1.25.0.linux-amd64.tar.gz
            rm -f go1.25.0.linux-amd64.tar.gz
          fi
          
          # Clone repository
          echo "📥 Cloning repository..."
          git clone https://github.com/X-culture24/sdics.git "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          
          # Build API
          echo "🔨 Building API..."
          mkdir -p bin
          $GO_PATH/go build -o bin/nvrcms-api ./cmd/api
          chmod 755 bin/nvrcms-api
          
          # Build Frontend
          echo "⚛️ Building Frontend..."
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..
          
          # Setup directories and config
          mkdir -p logs uploads
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          
          # Configure Nginx
          echo "⚙️ Configuring Nginx..."
          sudo tee /etc/nginx/sites-available/sdics.tech > /dev/null << 'NGINX'
          server {
              listen 80;
              server_name sdics.tech www.sdics.tech;
              return 301 https://$server_name$request_uri;
          }
          server {
              listen 443 ssl http2;
              server_name sdics.tech www.sdics.tech;
              ssl_certificate /etc/letsencrypt/live/sdics.tech/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/sdics.tech/privkey.pem;
              client_max_body_size 55M;
              root /home/lawrence/nvrcms/frontend/dist;
              index index.html;
              location / {
                  try_files $uri $uri/ /index.html;
              }
              location /api/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location /ws {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "Upgrade";
              }
          }
          NGINX
          
          sudo nginx -t
          sudo systemctl reload nginx
          
          # Create systemd service
          echo "⚙️ Setting up systemd service..."
          sudo tee /etc/systemd/system/nvrcms-api.service > /dev/null << 'SERVICE'
          [Unit]
          Description=NVRCMS API
          After=network.target postgresql.service
          [Service]
          Type=simple
          User=lawrence
          WorkingDirectory=/home/lawrence/nvrcms
          EnvironmentFile=/home/lawrence/nvrcms/.env
          ExecStart=/home/lawrence/nvrcms/bin/nvrcms-api
          Restart=always
          RestartSec=5
          StandardOutput=append:/home/lawrence/nvrcms/logs/api.log
          StandardError=append:/home/lawrence/nvrcms/logs/api-error.log
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          sudo systemctl daemon-reload
          sudo systemctl enable nvrcms-api
          sudo systemctl start nvrcms-api
          sleep 3
          
          # Verify deployment
          echo "✅ Verifying deployment..."
          if sudo systemctl is-active --quiet nvrcms-api; then
            echo "✅ API service is running"
          else
            echo "❌ API service failed to start"
            sudo systemctl status nvrcms-api || true
            exit 1
          fi
          
          echo "✅ Deployment successful - https://sdics.tech"
          EOF
