name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Go API ─────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build React frontend
        run: npm run build
        working-directory: frontend

      # ── SSH Setup ──────────────────────────────────────────────────────────
      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H sdics.tech >> ~/.ssh/known_hosts 2>/dev/null || true

      # ── Deploy React Frontend ──────────────────────────────────────────────
      - name: Deploy React frontend
        run: bash scripts/deploy-react-production.sh
        env:
          REMOTE_USER: root
          REMOTE_HOST: sdics.tech

      # ── Deploy API Binary ──────────────────────────────────────────────────
      - name: Deploy API binary
        run: |
          scp bin/nvrcms-api root@sdics.tech:/home/lawrence/nvrcms/bin/
          
          ssh root@sdics.tech 'bash -s' << 'API_DEPLOY'
          set -e
          
          echo "🛑 Stopping nvrcms-api service..."
          systemctl stop nvrcms-api || true
          sleep 2
          
          echo "🔧 Setting permissions..."
          chmod 755 /home/lawrence/nvrcms/bin/nvrcms-api
          chown lawrence:lawrence /home/lawrence/nvrcms/bin/nvrcms-api
          
          echo "▶️  Starting nvrcms-api service..."
          systemctl start nvrcms-api
          sleep 3
          
          echo "✅ API deployed and running"
          API_DEPLOY

      # ── Copy supporting files ──────────────────────────────────────────────
      - name: Copy datasets and migrations
        run: |
          ssh root@sdics.tech "mkdir -p /home/lawrence/nvrcms/migrations /home/lawrence/nvrcms/datasets /home/lawrence/nvrcms/scripts"
          scp -r datasets/. root@sdics.tech:/home/lawrence/nvrcms/datasets/
          scp -r migrations/. root@sdics.tech:/home/lawrence/nvrcms/migrations/
          scp scripts/migrate.sh scripts/seed.sql root@sdics.tech:/home/lawrence/nvrcms/scripts/

      # ── Verify deployment ──────────────────────────────────────────────────
      - name: Verify deployment
        run: |
          ssh root@sdics.tech 'bash -s' << 'VERIFY'
          set -e
          
          echo ""
          echo "================================================"
          echo "✅ DEPLOYMENT VERIFICATION"
          echo "================================================"
          echo ""
          
          echo "🔍 Services status:"
          systemctl is-active --quiet nginx && echo "  ✅ Nginx: running" || echo "  ❌ Nginx: stopped"
          systemctl is-active --quiet nvrcms-api && echo "  ✅ NVRCMS API: running" || echo "  ❌ NVRCMS API: stopped"
          
          echo ""
          echo "🔗 Testing endpoints..."
          
          if curl -s http://localhost:8080/health | grep -q '"status":"ok"'; then
            echo "  ✅ API health: OK"
          else
            echo "  ⚠️  API health: checking"
          fi
          
          echo ""
          echo "📊 Frontend files:"
          if [ -f /home/lawrence/nvrcms/frontend/index.html ]; then
            echo "  ✅ React app deployed ($(find /home/lawrence/nvrcms/frontend -type f | wc -l) files)"
          else
            echo "  ❌ Frontend index.html not found"
          fi
          
          echo ""
          echo "🌐 Application ready at:"
          echo "  • https://sdics.tech"
          echo "  • https://sdics.tech/api/v1"
          echo ""
          VERIFY
