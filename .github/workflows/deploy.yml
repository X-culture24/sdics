name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Go API ─────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build React frontend
        run: npm run build
        working-directory: frontend

      # ── SSH Setup ──────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      # ── Prepare remote + stop service ──────────────────────────────────────
      - name: Prepare remote directories and stop service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              mkdir -p /home/lawrence/nvrcms/bin /home/lawrence/nvrcms/migrations /home/lawrence/nvrcms/scripts \
                       /home/lawrence/nvrcms/uploads /home/lawrence/nvrcms/logs /home/lawrence/nvrcms/frontend /home/lawrence/nvrcms/datasets
              systemctl stop nvrcms-api || true
              rm -f /home/lawrence/nvrcms/bin/nvrcms-api
            "

      # ── Copy Artifacts ─────────────────────────────────────────────────────
      - name: Copy API binary
        run: |
          chmod +x bin/nvrcms-api
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            bin/nvrcms-api \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/bin/nvrcms-api

      - name: Copy frontend build
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "rm -rf /home/lawrence/nvrcms/frontend/* && mkdir -p /home/lawrence/nvrcms/frontend"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            frontend/dist/* \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/frontend/

      - name: Copy datasets
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            datasets/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/datasets/

      - name: Copy migration files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            migrations/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/migrations/

      - name: Copy scripts
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/migrate.sh scripts/seed.sql scripts/configure-nginx.sh \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/scripts/

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Run migrations, configure nginx, and restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              set -e
              
              # Make scripts executable
              chmod +x /home/lawrence/nvrcms/bin/nvrcms-api
              chmod +x /home/lawrence/nvrcms/scripts/migrate.sh
              chmod +x /home/lawrence/nvrcms/scripts/configure-nginx.sh
              
              # Fix permissions on frontend
              chmod -R 755 /home/lawrence/nvrcms/frontend
              find /home/lawrence/nvrcms/frontend -type f -exec chmod 644 {} \;
              
              # Run migrations
              echo '▶ Running database migrations...'
              bash /home/lawrence/nvrcms/scripts/migrate.sh
              
              # Configure nginx
              echo '▶ Configuring Nginx...'
              bash /home/lawrence/nvrcms/scripts/configure-nginx.sh
              
              # Restart service
              echo '▶ Restarting nvrcms-api service...'
              systemctl restart nvrcms-api
              
              sleep 2
              
              # Check status
              echo '▶ Service status:'
              systemctl status nvrcms-api --no-pager
              
              # Test API
              echo '▶ Testing API health...'
              curl -s http://localhost:8080/health | jq '.status' || echo 'API responding'
              
              echo '✅ Deploy complete - React frontend deployed'
            "
