name: Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build API
        run: |
          mkdir -p bin
          go build -o bin/sdics_api ./cmd/api

      - name: Build Frontend
        run: |
          cd frontend
          npm install --legacy-peer-deps
          npm run build
          cd ..

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Deploy
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
          set -e
          
          DEPLOY_DIR="/home/lawrence/nvrcms"
          
          echo "🔄 Starting deployment..."
          
          # Stop service
          sudo systemctl stop nvrcms-api || true
          
          # Clean deploy directory
          echo "🧹 Cleaning old deployment..."
          if [ -d "$DEPLOY_DIR" ]; then
            rm -rf "$DEPLOY_DIR"
          fi
          
          # Clone repository (without building)
          echo "📥 Cloning repository..."
          git clone https://github.com/X-culture24/sdics.git "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"
          
          # Setup directories and config
          mkdir -p bin logs uploads
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          
          echo "✅ Deployment files ready"
          EOF

      - name: Deploy Binary and Frontend
        run: |
          DEPLOY_DIR="/home/lawrence/nvrcms"
          
          echo "📦 Uploading built artifacts..."
          # Copy pre-built binary
          scp -o StrictHostKeyChecking=accept-new bin/sdics_api ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:$DEPLOY_DIR/bin/
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} chmod +x $DEPLOY_DIR/bin/sdics_api
          
          # Copy frontend dist
          scp -r -o StrictHostKeyChecking=accept-new frontend/dist/* ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:$DEPLOY_DIR/frontend/dist/
          
          # Create .env file from environment variables on server
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'ENVEOF'
          cat > /home/lawrence/nvrcms/.env << 'EOF'
          # Database
          DB_HOST=localhost
          DB_PORT=5432
          DB_NAME=sdic
          DB_USER=sdic_agent
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_SSLMODE=disable
          
          # JWT
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          JWT_EXPIRY_MINUTES=15
          REFRESH_SECRET=${{ secrets.REFRESH_SECRET }}
          REFRESH_EXPIRY_DAYS=7
          
          # Server
          PORT=8080
          ENV=production
          ALLOWED_ORIGINS=https://sdics.tech,http://sdics.tech,http://localhost:3000,http://localhost:5173
          
          # Rate Limiting
          RATE_LIMIT_UNAUTH=20
          RATE_LIMIT_AUTH=100
          
          # File Storage
          UPLOAD_DIR=./uploads
          MAX_UPLOAD_MB=50
          
          # Email (for password reset)
          SMTP_HOST=smtp.gmail.com
          SMTP_PORT=587
          SMTP_USER=your_email@gmail.com
          SMTP_PASS=your_app_password_here
          EOF
          ENVEOF

      - name: Configure and Start
        run: |
          ssh -o StrictHostKeyChecking=accept-new ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} << 'EOF'
          set -e
          
          DEPLOY_DIR="/home/lawrence/nvrcms"
          
          # Configure Nginx
          echo "⚙️ Configuring Nginx..."
          sudo tee /etc/nginx/sites-available/sdics.tech > /dev/null << 'NGINX'
          server {
              listen 80;
              server_name sdics.tech www.sdics.tech;
              return 301 https://$server_name$request_uri;
          }
          server {
              listen 443 ssl http2;
              server_name sdics.tech www.sdics.tech;
              ssl_certificate /etc/letsencrypt/live/sdics.tech/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/sdics.tech/privkey.pem;
              client_max_body_size 55M;
              root /home/lawrence/nvrcms/frontend/dist;
              index index.html;
              location / {
                  try_files $uri $uri/ /index.html;
              }
              location /api/ {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location /ws {
                  proxy_pass http://127.0.0.1:8080;
                  proxy_set_header Upgrade $http_upgrade;
                  proxy_set_header Connection "Upgrade";
              }
          }
          NGINX
          
          sudo nginx -t
          sudo systemctl reload nginx
          
          # Create systemd service
          echo "⚙️ Setting up systemd service..."
          sudo tee /etc/systemd/system/nvrcms-api.service > /dev/null << 'SERVICE'
          [Unit]
          Description=SDICS API
          After=network.target postgresql.service
          [Service]
          Type=simple
          User=lawrence
          WorkingDirectory=/home/lawrence/nvrcms
          EnvironmentFile=/home/lawrence/nvrcms/.env
          ExecStart=/home/lawrence/nvrcms/bin/sdics_api
          Restart=always
          RestartSec=5
          StandardOutput=append:/home/lawrence/nvrcms/logs/api.log
          StandardError=append:/home/lawrence/nvrcms/logs/api-error.log
          [Install]
          WantedBy=multi-user.target
          SERVICE
          
          sudo systemctl daemon-reload
          sudo systemctl enable nvrcms-api
          sudo systemctl start nvrcms-api
          sleep 3
          
          # Verify deployment
          echo "✅ Verifying deployment..."
          if sudo systemctl is-active --quiet nvrcms-api; then
            echo "✅ API service is running"
          else
            echo "❌ API service failed to start"
            sudo systemctl status nvrcms-api || true
            exit 1
          fi
          
          echo "✅ Deployment successful - https://sdics.tech"
          EOF
