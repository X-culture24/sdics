name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Go API ─────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      # ── Frontend ──────────────────────────────────────────────────────────
      # No build needed - vanilla HTML/CSS/JS frontend

      # ── SSH Setup ──────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      # ── Prepare remote + stop service ──────────────────────────────────────
      - name: Prepare remote directories and stop service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              mkdir -p ~/nvrcms/bin ~/nvrcms/migrations ~/nvrcms/scripts \
                       ~/nvrcms/uploads ~/nvrcms/logs ~/nvrcms/frontend ~/nvrcms/datasets
              sudo -n systemctl stop nvrcms-api || true
              rm -f ~/nvrcms/bin/nvrcms-api
            "

      # ── Copy Artifacts ─────────────────────────────────────────────────────
      - name: Copy API binary
        run: |
          chmod +x bin/nvrcms-api
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            bin/nvrcms-api \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/bin/nvrcms-api

      - name: Copy frontend build
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} \
            "rm -rf ~/nvrcms/frontend/* && mkdir -p ~/nvrcms/frontend"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            frontend/{index.html,js,styles} \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/frontend/

      - name: Copy datasets
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            datasets/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/datasets/

      - name: Copy migration files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            migrations/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/migrations/

      - name: Copy scripts
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/migrate.sh scripts/seed.sql scripts/configure-nginx.sh \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/scripts/

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Run migrations, configure nginx, and restart service
        env:
          SUDO_PASSWORD: ${{ secrets.SUDO_PASSWORD }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              set -e
              
              # Make scripts executable
              chmod +x ~/nvrcms/bin/nvrcms-api
              chmod +x ~/nvrcms/scripts/migrate.sh
              chmod +x ~/nvrcms/scripts/configure-nginx.sh
              
              # Run migrations
              echo '▶ Running database migrations...'
              bash ~/nvrcms/scripts/migrate.sh
              
              # Configure nginx (with sudo)
              echo '▶ Configuring Nginx...'
              echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S bash ~/nvrcms/scripts/configure-nginx.sh 2>/dev/null || {
                echo '⚠ Nginx config failed'
              }
              
              # Restart service (with sudo)
              echo '▶ Restarting nvrcms-api service...'
              echo '${{ secrets.SUDO_PASSWORD }}' | sudo -S systemctl restart nvrcms-api || {
                echo '⚠ Service restart failed'
                exit 1
              }
              
              sleep 2
              
              # Check status
              echo '▶ Service status:'
              systemctl status nvrcms-api --no-pager
              
              echo '✅ Deploy steps completed'
            "
