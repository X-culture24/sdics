name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build Go API and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DO_SSH_KEY }}

      - name: Add server to known hosts
        run: ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      - name: Create remote directories
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
            mkdir -p ~/nvrcms/bin
            mkdir -p ~/nvrcms/migrations
            mkdir -p ~/nvrcms/scripts
            mkdir -p ~/nvrcms/uploads
            mkdir -p ~/nvrcms/logs
            mkdir -p ~/nvrcms/frontend
          "

      - name: Copy API binary
        run: |
          chmod +x bin/nvrcms-api
          scp bin/nvrcms-api ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/bin/nvrcms-api

      - name: Copy migration files
        run: |
          scp -r migrations/. ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/migrations/

      - name: Copy scripts
        run: |
          scp scripts/migrate.sh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:~/nvrcms/scripts/migrate.sh

      - name: Restart API service
        run: |
          ssh ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
            chmod +x ~/nvrcms/bin/nvrcms-api
            chmod +x ~/nvrcms/scripts/migrate.sh
            sudo systemctl restart nvrcms-api
            sleep 2
            sudo systemctl status nvrcms-api --no-pager
            echo '✅ Deploy complete'
          "
