name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Go API ─────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      # ── React Frontend ─────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build frontend
        run: npm run build
        working-directory: frontend

      # ── SSH Setup ──────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      # ── Prepare remote + stop service ──────────────────────────────────────
      - name: Prepare remote directories and stop service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              mkdir -p /home/lawrence/nvrcms/bin \
                       /home/lawrence/nvrcms/migrations \
                       /home/lawrence/nvrcms/scripts \
                       /home/lawrence/nvrcms/uploads \
                       /home/lawrence/nvrcms/logs \
                       /home/lawrence/nvrcms/frontend \
                       /home/lawrence/nvrcms/datasets
              sudo systemctl stop nvrcms-api || true
            "

      # ── Copy Artifacts ─────────────────────────────────────────────────────
      - name: Copy API binary
        run: |
          chmod +x bin/nvrcms-api
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            bin/nvrcms-api \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/bin/nvrcms-api

      - name: Copy frontend build
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            frontend/dist/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/frontend/

      - name: Copy datasets
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            datasets/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/datasets/

      - name: Copy migration files
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            migrations/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/migrations/

      - name: Copy scripts
        run: |
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/migrate.sh scripts/seed.sql \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/scripts/

      # ── Deploy ─────────────────────────────────────────────────────────────
      - name: Run migrations and restart service
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              chmod +x /home/lawrence/nvrcms/bin/nvrcms-api
              chmod +x /home/lawrence/nvrcms/scripts/migrate.sh
              chmod o+x /home/lawrence
              chmod o+x /home/lawrence/nvrcms
              chmod -R o+rx /home/lawrence/nvrcms/frontend
              chown -R lawrence:lawrence /home/lawrence/nvrcms
              bash /home/lawrence/nvrcms/scripts/migrate.sh
              sudo systemctl restart nvrcms-api
              sleep 2
              sudo systemctl status nvrcms-api --no-pager
              echo '✅ Deploy complete'
            "
