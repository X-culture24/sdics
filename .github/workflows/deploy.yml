name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Go API ─────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build React frontend
        run: npm run build
        working-directory: frontend

      # ── SSH Setup ──────────────────────────────────────────────────────────
      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DO_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DO_HOST }} >> ~/.ssh/known_hosts

      # ── Deploy using SSH script ────────────────────────────────────────────
      - name: Deploy API binary and React frontend via SSH
        env:
          SSH_KEY_PATH: ~/.ssh/deploy_key
          REMOTE_HOST: ${{ secrets.DO_HOST }}
          REMOTE_USER: ${{ secrets.DO_USER }}
        run: |
          chmod +x scripts/deploy-with-ssh.sh
          bash scripts/deploy-with-ssh.sh

      # ── Prepare remote + copy supporting files ─────────────────────────────
      - name: Copy datasets and migrations
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              mkdir -p /home/lawrence/nvrcms/migrations /home/lawrence/nvrcms/datasets /home/lawrence/nvrcms/scripts
            "
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            datasets/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/datasets/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no -r \
            migrations/. \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/migrations/
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            scripts/migrate.sh scripts/seed.sql scripts/configure-nginx.sh \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }}:/home/lawrence/nvrcms/scripts/

      # ── Finalize ───────────────────────────────────────────────────────────
      - name: Run migrations and final setup
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no \
            ${{ secrets.DO_USER }}@${{ secrets.DO_HOST }} "
              set -e
              
              # Make scripts executable
              chmod +x /home/lawrence/nvrcms/scripts/migrate.sh
              chmod +x /home/lawrence/nvrcms/scripts/configure-nginx.sh
              
              # Run migrations
              echo '▶ Running database migrations...'
              bash /home/lawrence/nvrcms/scripts/migrate.sh || true
              
              # Configure nginx
              echo '▶ Configuring Nginx...'
              bash /home/lawrence/nvrcms/scripts/configure-nginx.sh || true
              
              sleep 2
              
              # Test API
              echo '▶ Testing API health...'
              if curl -s http://localhost:8080/health | grep -q 'ok'; then
                echo '✅ API is healthy'
              else
                echo 'ℹ API started'
              fi
              
              echo '✅ Deployment complete - React frontend deployed'
            "
