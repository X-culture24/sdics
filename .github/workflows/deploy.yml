name: Build and Deploy to sdics.tech

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # ── Go API ─────────────────────────────────────────────────────────────
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Download Go dependencies
        run: go mod download

      - name: Build binary (linux/amd64)
        run: GOOS=linux GOARCH=amd64 go build -o bin/nvrcms-api ./cmd/api

      # ── Frontend ──────────────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install frontend dependencies
        run: npm install
        working-directory: frontend

      - name: Build React frontend
        run: npm run build
        working-directory: frontend

      # ── Deploy Frontend via SSH ────────────────────────────────────────────
      - name: Deploy React frontend
        run: |
          scp -o StrictHostKeyChecking=accept-new -r frontend/dist/* root@sdics.tech:/home/nvrcms/frontend/
          ssh -o StrictHostKeyChecking=accept-new root@sdics.tech "bash -s" << 'DEPLOY_FRONTEND'
          #!/bin/bash
          set -e
          
          REMOTE_PATH="/home/nvrcms/frontend"
          
          echo "📋 Setting permissions..."
          find "$REMOTE_PATH" -type d -exec chmod 755 {} \;
          find "$REMOTE_PATH" -type f -exec chmod 644 {} \;
          
          echo "🌐 Reloading Nginx..."
          systemctl reload nginx
          
          echo "✅ Frontend deployed: $(find $REMOTE_PATH -type f | wc -l) files"
          DEPLOY_FRONTEND

      # ── Deploy API Binary ─────────────────────────────────────────────────
      - name: Deploy API binary
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@sdics.tech "bash -s" << 'BACKUP_API'
          #!/bin/bash
          set -e
          
          REMOTE_PATH="/home/nvrcms/bin"
          
          mkdir -p "$REMOTE_PATH"
          if [ -f "$REMOTE_PATH/nvrcms-api" ]; then
            cp "$REMOTE_PATH/nvrcms-api" "$REMOTE_PATH/nvrcms-api.backup-$(date +%s)"
            echo "✅ API backed up"
          fi
          
          echo "🛑 Stopping nvrcms-api service..."
          systemctl stop nvrcms-api || true
          sleep 2
          BACKUP_API
          
          scp -o StrictHostKeyChecking=accept-new bin/nvrcms-api root@sdics.tech:/home/nvrcms/bin/
          
          ssh -o StrictHostKeyChecking=accept-new root@sdics.tech "bash -s" << 'START_API'
          #!/bin/bash
          set -e
          
          echo "🔧 Setting permissions..."
          chmod 755 /home/nvrcms/bin/nvrcms-api
          chown lawrence:lawrence /home/nvrcms/bin/nvrcms-api
          
          echo "▶️  Starting nvrcms-api service..."
          systemctl start nvrcms-api
          sleep 3
          
          echo "✅ API deployed and running"
          START_API

      # ── Copy supporting files ──────────────────────────────────────────────
      - name: Copy datasets and migrations
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@sdics.tech "mkdir -p /home/nvrcms/migrations /home/nvrcms/datasets /home/nvrcms/scripts"
          scp -o StrictHostKeyChecking=accept-new -r datasets/. root@sdics.tech:/home/nvrcms/datasets/
          scp -o StrictHostKeyChecking=accept-new -r migrations/. root@sdics.tech:/home/nvrcms/migrations/
          scp -o StrictHostKeyChecking=accept-new scripts/migrate.sh scripts/seed.sql root@sdics.tech:/home/nvrcms/scripts/

      # ── Verify deployment ──────────────────────────────────────────────────
      - name: Verify deployment
        run: |
          ssh -o StrictHostKeyChecking=accept-new root@sdics.tech "bash -s" << 'VERIFY'
          #!/bin/bash
          
          echo ""
          echo "================================================"
          echo "✅ DEPLOYMENT VERIFICATION"
          echo "================================================"
          echo ""
          
          echo "🔍 Services status:"
          systemctl is-active --quiet nginx && echo "  ✅ Nginx: running" || echo "  ❌ Nginx: stopped"
          systemctl is-active --quiet nvrcms-api && echo "  ✅ NVRCMS API: running" || echo "  ❌ NVRCMS API: stopped"
          
          echo ""
          echo "🔗 Testing endpoints..."
          if curl -s http://localhost:8080/health | grep -q '"status":"ok"'; then
            echo "  ✅ API health: OK"
          else
            echo "  ⚠️  API health: checking"
          fi
          
          echo ""
          echo "📊 Frontend files:"
          if [ -f /home/nvrcms/frontend/index.html ]; then
            FILE_COUNT=$(find /home/nvrcms/frontend -type f | wc -l)
            echo "  ✅ React app deployed ($FILE_COUNT files)"
          else
            echo "  ❌ Frontend index.html not found"
          fi
          
          echo ""
          echo "🌐 Application ready at:"
          echo "  • https://sdics.tech"
          echo "  • https://sdics.tech/api/v1"
          echo ""
          VERIFY
