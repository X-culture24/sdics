<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - NVRCMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.2/dist/axios.min.js"></script>
    
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar Navigation -->
        <nav class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <h4 class="mb-0"><i class="bi bi-chart-line"></i> NVRCMS</h4>
            </div>
            <ul class="nav nav-pills flex-column mb-auto">
                <li class="nav-item">
                    <a class="nav-link active" href="#" data-page="dashboard">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="citizens">
                        <i class="bi bi-people"></i> Citizens
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="campaigns">
                        <i class="bi bi-megaphone"></i> Campaigns
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="imports">
                        <i class="bi bi-upload"></i> Imports
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="reports">
                        <i class="bi bi-file-pdf"></i> Reports
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="users">
                        <i class="bi bi-person-badge"></i> Users
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#" data-page="audit">
                        <i class="bi bi-shield-lock"></i> Audit Logs
                    </a>
                </li>
            </ul>
            <hr>
            <div class="dropdown">
                <a href="#" class="d-flex align-items-center link-dark text-decoration-none dropdown-toggle" id="dropdownUser" data-bs-toggle="dropdown" aria-expanded="false">
                    <i class="bi bi-person-circle"></i>
                    <span class="d-none d-sm-inline mx-2" id="userEmail">User</span>
                </a>
                <ul class="dropdown-menu dropdown-menu-dark text-small" aria-labelledby="dropdownUser">
                    <li><a class="dropdown-item" href="#" data-page="profile">Profile</a></li>
                    <li><a class="dropdown-item" href="#" id="logoutBtn">Logout</a></li>
                </ul>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <div class="topbar">
                <button class="btn btn-sm btn-ghost" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <div class="topbar-spacer"></div>
                <div class="topbar-right">
                    <span id="currentDateTime" class="me-3"></span>
                    <div class="dropdown">
                        <button class="btn btn-sm btn-ghost dropdown-toggle" id="notificationBtn" data-bs-toggle="dropdown">
                            <i class="bi bi-bell"></i>
                            <span id="notificationBadge" class="badge bg-danger">0</span>
                        </button>
                        <ul class="dropdown-menu dropdown-menu-end notification-dropdown" id="notificationList">
                            <li><a class="dropdown-item" href="#">No notifications</a></li>
                        </ul>
                    </div>
                </div>
            </div>

            <!-- Page Content -->
            <div class="page-content">
                <div id="pageContainer"></div>
            </div>
        </main>
    </div>

    <!-- Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay">
        <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
        </div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>
</html>
