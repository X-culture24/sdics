<VirtualHost *:80>
    ServerName sdics.tech
    ServerAlias www.sdics.tech
    ServerAdmin admin@sdics.tech
    
    DocumentRoot /home/lawrence/nvrcms/frontend
    
    <Directory /home/lawrence/nvrcms/frontend>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
        
        # React Router - serve index.html for all routes
        <IfModule mod_rewrite.c>
            RewriteEngine On
            RewriteBase /
            RewriteRule ^index\.html$ - [L]
            RewriteCond %{REQUEST_FILENAME} !-f
            RewriteCond %{REQUEST_FILENAME} !-d
            RewriteRule . /index.html [L]
        </IfModule>
    </Directory>
    
    # API Proxy
    <Location /api/>
        ProxyPreserveHost On
        ProxyPass http://localhost:8080/api/
        ProxyPassReverse http://localhost:8080/api/
    </Location>
    
    # Assets caching
    <FilesMatch "\.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$">
        Header set Cache-Control "public, max-age=31536000, immutable"
    </FilesMatch>
    
    ErrorLog ${APACHE_LOG_DIR}/sdics_error.log
    CustomLog ${APACHE_LOG_DIR}/sdics_access.log combined
</VirtualHost>
